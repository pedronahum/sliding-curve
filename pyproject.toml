[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidingcurve"
version = "0.0.1"
description = "Term premia and bond convexity under sliding-curve dynamics in a quasi-Gaussian model (JAX)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["slidingcurve*"]

[tool.setuptools.package-data]
slidingcurve = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
